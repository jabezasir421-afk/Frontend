<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <center>
        <h1>Registration Form</h1>

        <table>
            <tr>
                <td>Name</td><td><input type="text" placeholder="Enter Your Name"></td>
            </tr>
            <tr>
                <td>Age</td><td><input type="number" placeholder="Enter Your Age"></td>

            <tr>
                <td>Gender</td>
                <td><input type="radio" name="gender" id="">Male <input type="radio" name="gender" id="">Female</td>
            </tr>
            <tr>
                <td>Email</td><td><input type="email" placeholder="Enetr Your Email"></td>
            </tr>
            <tr>
                <td>Select a Role</td>
                <td>
                    <select >
                        <option >Team Principle</option>
                        <option >Driver</option>
                        <option >Strategist</option>
                        <option >Race Engineer</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Upload Your ID</td><td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td><input type="submit"></td><td><input type="reset" ></td>
            </tr>
        </table>
    </center>
